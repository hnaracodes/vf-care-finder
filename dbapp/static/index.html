<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <a class="skip" href="#note">Skip to the answer</a>
    <header class="top">
      <a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Find care you can trust</a>
      <div id="qline" class="qline" role="search" hidden>
        <span id="chips" class="chips"></span>
        <button id="change" class="btn-change" type="button" aria-controls="ask" aria-expanded="false">Change</button>
      </div>
    </header>

    <main id="main" class="layout is-landing">
      <section id="ask" class="a-ask" aria-label="Search">
        <p id="intro" class="intro">Pick the care and the place. We show up to 3 facilities, quote their own records, and say when nothing reliable is near.</p>
        <form id="query" class="qform" autocomplete="off">
          <label class="field">
            <span class="field-label">What care is needed?</span>
            <select id="service" required></select>
          </label>
          <label class="field" id="other-wrap" hidden>
            <span class="field-label">Describe the care</span>
            <input id="other" type="text" placeholder="for example, cataract surgery" />
          </label>
          <label class="field field-place">
            <span class="field-label">Where is the patient?</span>
            <input id="place" type="text" required placeholder="PIN, village or town" />
          </label>
          <button id="go" class="btn-find" type="submit">Find care</button>
        </form>
        <div id="examples" class="exs" role="group" aria-label="Example searches"></div>
      </section>
      <div id="origin" class="a-origin"></div>
      <div id="note" class="a-note" aria-live="polite" tabindex="-1"></div>
      <div id="backups" class="a-backups"></div>
      <div id="folds" class="a-folds"></div>
      <div id="planners" class="a-planners"></div>
      <aside id="mapcol" class="a-map" aria-label="Map">
        <div id="map" class="map-inline"></div>
      </aside>
      <footer id="footer" class="a-footer"></footer>
    </main>

  </body>
